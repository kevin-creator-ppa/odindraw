<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdinDraw</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
</head>
<body>
    <div class="app">
        <!-- Top bar -->
        <header class="topbar">
            <div class="topbar__group topbar__group--brand">
                <span class="brand">OdinDraw</span>
                <span class="diagram-name" data-diagram-name>Sem título</span>
            </div>

            <div class="topbar__group">
                <button class="btn" data-action="new" title="Novo (Ctrl+N)">Novo</button>
                <div class="dropdown" data-dropdown="open-diagram">
                    <button class="btn" data-action="open" title="Abrir (Ctrl+O)">Abrir</button>
                    <div class="dropdown__menu" data-open-diagram-menu>
                        <p class="dropdown__empty">Nenhum diagrama salvo</p>
                    </div>
                </div>
                <button class="btn" data-action="save" title="Salvar (Ctrl+S)">Salvar</button>
                <span class="divider"></span>
                <div class="dropdown" data-dropdown="export">
                    <button class="btn" data-action="export-menu" title="Exportar">Exportar</button>
                    <div class="dropdown__menu">
                        <button class="dropdown__item" data-action="export-png">PNG</button>
                        <button class="dropdown__item" data-action="export-svg">SVG</button>
                        <button class="dropdown__item" data-action="export-pdf">PDF</button>
                    </div>
                </div>
                <span class="divider"></span>
                <button class="btn btn--icon" data-action="undo" title="Desfazer (Ctrl+Z)">&#8630;</button>
                <button class="btn btn--icon" data-action="redo" title="Refazer (Ctrl+Y)">&#8631;</button>
            </div>

            <div class="topbar__group topbar__group--right">
                <button class="btn btn--icon" data-action="zoom-out" title="Zoom -">&minus;</button>
                <span class="zoom-level" data-zoom-level>100%</span>
                <button class="btn btn--icon" data-action="zoom-in" title="Zoom +">+</button>
                <button class="btn" data-action="zoom-fit" title="Ajustar à tela">Ajustar</button>
                <span class="divider"></span>
                <button class="btn btn--icon" data-action="toggle-grid" data-active="true" title="Mostrar/ocultar grade">&#9638;</button>
                <button class="btn btn--icon" data-action="toggle-theme" title="Alternar tema claro/escuro">&#9680;</button>
            </div>
        </header>

        <!-- Left sidebar: tools -->
        <aside class="sidebar sidebar--left" aria-label="Ferramentas">
            <div class="tool-group">
                <button class="tool tool--active" data-tool="select" title="Seleção (V)">&#9650;</button>
                <button class="tool" data-tool="pan" title="Mão / Pan (H)">&#9995;</button>
            </div>
            <span class="divider divider--horizontal"></span>
            <div class="tool-group">
                <button class="tool" data-tool="rectangle" title="Retângulo (R)">&#9633;</button>
                <button class="tool" data-tool="square" title="Quadrado">&#9723;</button>
                <button class="tool" data-tool="circle" title="Círculo">&#9675;</button>
                <button class="tool" data-tool="ellipse" title="Elipse (O)">&#11052;</button>
                <button class="tool" data-tool="line" title="Linha (L)">&#9585;</button>
                <button class="tool" data-tool="arrow" title="Seta (A)">&#8594;</button>
                <button class="tool" data-tool="orthogonal-line" title="Linha ortogonal">&#8735;</button>
            </div>
            <span class="divider divider--horizontal"></span>
            <div class="tool-group">
                <button class="tool" data-tool="text" title="Texto (T)">A</button>
                <button class="tool" data-tool="freehand" title="Desenho livre (P)">&#9998;</button>
                <button class="tool" data-tool="eraser" title="Borracha (E)">&#9003;</button>
            </div>
            <span class="divider divider--horizontal"></span>
            <div class="tool-group">
                <button class="tool" data-action="toggle-library" title="Biblioteca de componentes">&#9638;</button>
            </div>
        </aside>

        <!-- Painel flutuante da biblioteca de componentes -->
        <aside class="library-panel" data-library-panel hidden>
            <div class="library-panel__header">
                <input type="search" class="library-panel__search" placeholder="Buscar componente…" data-library-search>
                <button class="btn btn--icon" data-action="close-library" title="Fechar">&times;</button>
            </div>
            <div class="library-panel__body" data-library-body>
                <p class="dropdown__empty">Carregando…</p>
            </div>
        </aside>

        <!-- Canvas area -->
        <main class="canvas-area" data-canvas-area>
            <canvas id="static-canvas" class="canvas-layer"></canvas>
            <canvas id="interactive-canvas" class="canvas-layer"></canvas>

            <div class="minimap" data-minimap title="Minimapa (Etapa 10)">
                <span class="minimap__label">Minimapa</span>
            </div>
        </main>

        <!-- Right sidebar: properties -->
        <aside class="sidebar sidebar--right" aria-label="Propriedades">
            <h2 class="sidebar__title">Propriedades</h2>

            <div class="property">
                <label>Cor da borda</label>
                <div class="swatches" data-swatches="stroke">
                    <button class="swatch" data-swatch-value="#1e1e1e" style="--swatch-color:#1e1e1e" title="Preto"></button>
                    <button class="swatch" data-swatch-value="#e03131" style="--swatch-color:#e03131" title="Vermelho"></button>
                    <button class="swatch" data-swatch-value="#2f9e44" style="--swatch-color:#2f9e44" title="Verde"></button>
                    <button class="swatch" data-swatch-value="#1971c2" style="--swatch-color:#1971c2" title="Azul"></button>
                    <button class="swatch" data-swatch-value="#f08c00" style="--swatch-color:#f08c00" title="Laranja"></button>
                    <input type="color" class="swatch swatch--custom" value="#1e1e1e" data-prop="stroke" title="Cor personalizada">
                </div>
            </div>
            <div class="property">
                <label>Cor de preenchimento</label>
                <div class="swatches" data-swatches="fill">
                    <button class="swatch swatch--transparent" data-swatch-value="transparent" title="Transparente"></button>
                    <button class="swatch" data-swatch-value="#ffc9c9" style="--swatch-color:#ffc9c9" title="Rosa"></button>
                    <button class="swatch" data-swatch-value="#b2f2bb" style="--swatch-color:#b2f2bb" title="Verde claro"></button>
                    <button class="swatch" data-swatch-value="#a5d8ff" style="--swatch-color:#a5d8ff" title="Azul claro"></button>
                    <button class="swatch" data-swatch-value="#ffec99" style="--swatch-color:#ffec99" title="Amarelo"></button>
                    <input type="color" class="swatch swatch--custom" value="#ffffff" data-prop="fill" title="Cor personalizada">
                </div>
            </div>
            <div class="property">
                <label>Espessura</label>
                <div class="segmented" data-prop="stroke-width">
                    <button data-value="1" title="Fina">&#9473;</button>
                    <button data-value="2" title="Média">&#9473;&#9473;</button>
                    <button data-value="4" title="Grossa">&#9473;&#9473;&#9473;</button>
                </div>
            </div>
            <div class="property">
                <label>Tipo de linha</label>
                <div class="segmented" data-prop="stroke-style">
                    <button data-value="solid" title="Sólida">&#8213;&#8213;&#8213;</button>
                    <button data-value="dashed" title="Tracejada">&#8211;&nbsp;&#8211;&nbsp;&#8211;</button>
                    <button data-value="dotted" title="Pontilhada">&middot;&middot;&middot;&middot;</button>
                </div>
            </div>
            <div class="property">
                <label>Transparência</label>
                <input type="range" min="0" max="100" value="100" data-prop="opacity">
            </div>

            <span class="divider divider--horizontal"></span>

            <div class="property">
                <label>Fonte</label>
                <select data-prop="font-family">
                    <option>Inter</option>
                    <option>Arial</option>
                    <option>Georgia</option>
                    <option>Monospace</option>
                </select>
            </div>
            <div class="property">
                <label>Tamanho da fonte</label>
                <input type="number" min="8" max="96" value="14" data-prop="font-size">
            </div>
            <div class="property">
                <label>Alinhamento</label>
                <div class="segmented">
                    <button data-prop="align" data-value="left">&#8676;</button>
                    <button data-prop="align" data-value="center">&#8596;</button>
                    <button data-prop="align" data-value="right">&#8677;</button>
                </div>
            </div>
            <div class="property" data-hide-for-connector>
                <label>Rotação</label>
                <input type="number" min="-180" max="180" value="0" data-prop="rotation">
            </div>
            <div class="property" data-connector-only hidden>
                <label>Tipo de rota</label>
                <select data-prop="route-type">
                    <option value="straight">Reta</option>
                    <option value="orthogonal">Ortogonal</option>
                    <option value="curved">Curva</option>
                </select>
            </div>

            <span class="divider divider--horizontal"></span>

            <div class="property">
                <label>Camada</label>
                <div class="segmented">
                    <button data-action="send-back" title="Enviar para trás">&#10515;</button>
                    <button data-action="send-backward" title="Recuar uma camada">&#8595;</button>
                    <button data-action="bring-forward" title="Avançar uma camada">&#8593;</button>
                    <button data-action="bring-front" title="Trazer para frente">&#10514;</button>
                </div>
            </div>
            <div class="property">
                <label>Ações</label>
                <div class="segmented">
                    <button data-action="duplicate-selected" title="Duplicar (Ctrl+D)">&#10697;</button>
                    <button data-action="delete-selected" title="Excluir (Del)">&#10005;</button>
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
